<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#DCE8F4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A566"/>
      <stop offset="1" stop-color="#C98F4C"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B97D3D"/>
      <stop offset="1" stop-color="#A86C2F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="420" rx="170" ry="26" fill="#0A3D6E" opacity="0.12"/>
  <g transform="translate(256 250)">
    <!-- faces -->
    <path d="M-160 -70 L0 10 L0 175 L-160 95 Z" fill="url(#left)"/>
    <path d="M160 -70 L0 10 L0 175 L160 95 Z" fill="url(#right)"/>
    <!-- rabats du dessus (fermés) -->
    <path d="M0 -150 L160 -70 L0 10 L-160 -70 Z" fill="#E6B87C"/>
    <path d="M-80 -110 L80 -30" stroke="#B9844A" stroke-width="3" opacity="0.6"/>
    <!-- ruban adhésif -->
    <path d="M-100 -120 L60 -40 L60 -20 L-100 -100 Z" fill="#F2D4A7" opacity="0.95"/>
    <path d="M60 -40 L60 -20 L60 60 L80 50 L80 -30 Z" fill="#E9C48E" opacity="0.95"/>
    <!-- arêtes -->
    <path d="M0 10 L0 175" stroke="#8E5A26" stroke-width="3" opacity="0.5"/>
    <path d="M-160 -70 L0 10 L160 -70" fill="none" stroke="#FFF3E0" stroke-width="3" opacity="0.6"/>
    <!-- étiquette d'expédition -->
    <path d="M-132 22 L-56 60 L-56 112 L-132 74 Z" fill="#FFFFFF"/>
    <g stroke="#0E5FA8" stroke-width="7" stroke-linecap="round">
      <path d="M-120 42 L-70 67"/>
      <path d="M-120 60 L-84 78"/>
    </g>
  </g>
</svg>
